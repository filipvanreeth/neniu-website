[PHP]
html_errors = 1
memory_limit = 256M
max_execution_time = 120
upload_max_filesize = 64M
post_max_size = 64M

; Xdebug 3 — mode & client_host worden door Lando (XDEBUG_MODE env) beheerd,
; niet hier instellen. Alleen aanvullende tuning hieronder.
[Xdebug]
xdebug.max_nesting_level = 512
xdebug.start_with_request = yes
xdebug.log = /tmp/xdebug.log
